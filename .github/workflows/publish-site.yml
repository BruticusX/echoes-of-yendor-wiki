# Keeps the "deploy" branch equal to the contents of site/, so the web host can serve that branch
# straight from its root (echoesofyendor.wiki pulls it).
name: Publish site branch

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push site/ as the deploy branch
        run: |
          cd site
          git init -q -b deploy
          git config user.name "BruticusX"
          git config user.email "352013509+BruticusX@users.noreply.github.com"
          git add -A
          git commit -q -m "Site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy
